<!doctype html>
<html lang="{{ page.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" sizes="32x32" href="{{ page.static_url("brand/favicon-32.png") }}">
<link rel="apple-touch-icon" href="{{ page.static_url("brand/apple-touch-icon.png") }}">
<title>{{ page.title }}</title>
<script>
(function () {
  var t;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<link rel="stylesheet" href="{{ page.css_url() }}">
<link rel="canonical" href="{{ page.canonical() }}">
<link rel="alternate" hreflang="en" href="{{ page.abs_url_for("en") }}">
<link rel="alternate" hreflang="ja" href="{{ page.abs_url_for("ja") }}">
<link rel="alternate" hreflang="x-default" href="{{ page.abs_url_for("en") }}">
</head>
<body>
<header class="site-header">
<div class="header-inner">
<a class="site-name" href="{{ page.url("") }}"><img class="site-logo" src="{{ page.static_url("brand/logo-48.png") }}" width="24" height="24" alt=""><span class="site-title">{{ page.site_title() }}</span></a>
<div class="header-actions">
<button type="button" id="theme-toggle" class="hbtn hbtn-icon" aria-pressed="false" aria-label="{{ page.t("header.theme") }}" title="{{ page.t("header.theme") }}"><span class="theme-sun">{{ page.icon("sun")|safe }}</span><span class="theme-moon">{{ page.icon("moon")|safe }}</span></button>
<a id="lang-switch" class="hbtn" data-lang-switch data-base="{{ page.url_for(page.other_lang()) }}" href="{{ page.url_for(page.other_lang()) }}" hreflang="{{ page.other_lang() }}">{{ page.icon("languages")|safe }}<span class="lang-name">{{ page.other_lang_name() }}</span></a>
</div>
</div>
</header>
<!-- GitHub Corners by Tim Holman (https://github.com/tholman/github-corners), MIT License. Colours and size are in style.css. -->
<a class="github-corner" href="https://github.com/{{ page.repo() }}" aria-label="{{ page.t("header.github") }}" title="{{ page.t("header.github") }}"><svg viewBox="0 0 250 250" aria-hidden="true"><path d="M0 0l115 115h15l12 27 108 108V0z"></path><path class="octo-arm" d="M128 109c-15-9-9-19-9-19 3-7 2-11 2-11-1-7 3-2 3-2 4 5 2 11 2 11-3 10 5 15 9 16" fill="currentColor"></path><path class="octo-body" d="M115 115s4 2 5 0l14-14c3-2 6-3 8-3-8-11-15-24 2-41 5-5 10-7 16-7 1-2 3-7 12-11 0 0 5 3 7 16 4 2 8 5 12 9s7 8 9 12c14 3 17 7 17 7-4 8-9 11-11 11 0 6-2 11-7 16-16 16-30 10-41 2 0 3-1 7-5 11l-12 11c-1 1 1 5 1 5z" fill="currentColor"></path></svg></a>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
<a href="{{ page.add_tool_url() }}">{{ page.t("footer.add_tool") }}</a>
<a href="{{ page.suggest_tool_url() }}">{{ page.t("footer.suggest_tool") }}</a>
<a href="{{ page.url("removed/") }}">{{ page.t("footer.removed") }}</a>
<span>{{ page.t("footer.updated") }}: <time datetime="{{ page.generated_at }}">{{ page.generated_at }}</time></span>
</footer>
<script>
document.querySelectorAll('a[data-lang-switch]').forEach(function (a) {
  a.href = a.dataset.base + location.search + location.hash;
});
</script>
<script>
(function () {
  var root = document.documentElement, btn = document.getElementById('theme-toggle'), mq = matchMedia('(prefers-color-scheme: dark)');
  function apply(t) { root.dataset.theme = t; btn.setAttribute('aria-pressed', t === 'dark'); }
  function stored() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
  apply(root.dataset.theme);
  btn.onclick = function () {
    var t = root.dataset.theme === 'dark' ? 'light' : 'dark';
    apply(t);
    try { localStorage.setItem('theme', t); } catch (e) {}
  };
  mq.onchange = function () { if (!stored()) apply(mq.matches ? 'dark' : 'light'); };
})();
</script>
</body>
</html>
