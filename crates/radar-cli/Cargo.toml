[package]
name = "radar-cli"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[lib]
name = "radar_cli"

[[bin]]
name = "radar"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
clap = { version = "4.6.7", features = ["derive"] }
radar-core = { version = "0.1.0", path = "../radar-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.8"
toml_edit = "0.25.17"
url = "2.5.8"

[dev-dependencies]
wiremock = "0.6.5"
