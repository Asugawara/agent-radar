[package]
name = "radar-web"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[[bin]]
name = "radar_web"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8.23", features = ["csr"] }
radar-core = { version = "0.1.0", path = "../radar-core" }
serde_json = "1.0.154"
any_spawner = { version = "0.3", features = ["wasm-bindgen"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "History", "Location", "HtmlElement", "HtmlInputElement", "DomRect", "Event", "EventTarget", "KeyboardEvent", "MouseEvent", "Storage"] }
