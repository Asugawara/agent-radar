name: Deploy

# Builds main and publishes it to GitHub Pages. Also called from maintain.yml:
# pushes made with GITHUB_TOKEN do not start other workflows, so the scheduled
# run deploys through workflow_call.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  pages: write
  id-token: write
  contents: read

# Do not set a concurrency group in a caller that uses this same group: the
# called workflow would cancel itself.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: ./.github/actions/setup-build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Week number (favicon cache key)
        run: echo "FAVICON_WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/favicons
          key: favicons-${{ env.FAVICON_WEEK }}
          restore-keys: favicons-
      - run: bash scripts/build-site.sh dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
